# Configuration Control Plane — lab HTTP (fallback)
#
# ⚠️  Ce fichier utilise Keycloak en HTTP (port 8081).
#     Utilisé uniquement quand KC_PROTO=http est passé aux scripts.
#     La configuration par défaut (HTTPS) est dans config.lab.yaml.
#
# Usage : KC_PROTO=http make deploy-cp

server:
  address: 0.0.0.0
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  read_header_timeout: 5s
  tls:
    enabled: true
    cert_file: ./certs/server.crt
    key_file: ./certs/server.key
    client_ca_file: ./certs/ca.crt
    require_client_auth: false

pep_server:
  address: 0.0.0.0
  port: 8443
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  read_header_timeout: 5s
  tls:
    enabled: true
    cert_file: ./certs/server.crt
    key_file: ./certs/server.key
    client_ca_file: ./certs/ca.crt
    require_client_auth: true

database:
  path: ./control-plane.db
  busy_timeout: 5s
  pragmas:
    - journal_mode = WAL
    - synchronous = NORMAL

logging:
  level: info
  format: json

oidc:
  issuer: "http://10.10.20.30:8081/realms/ztna"
  audience: "ztna-control-plane"
  username_claim: "preferred_username"
  groups_claim: "groups"
  allowed_algs: ["RS256"]
  jwks_cache_ttl: "10m"
  audience_mode: "aud_or_azp"
  admin_group: "ztna-admins"
  allow_http_issuer: true  # HTTP mode — lab fallback only

pep:
  auth_mode: token
  decision_ttl_seconds: 60
  require_registration: true
  revoked_pep_ids: []
  tokens:
    ztna-gw-01: "ztna-lab-pep-secret-2026"

device_ca:
  key_path: ./pki/device_ca.key
  cert_path: ./pki/device_ca.crt
  default_ttl: 168h
  min_ttl: 1h
  max_ttl: 720h
  allowed_key_types: ["ecdsa-p256", "ed25519"]

sshca:
  key_path: ./ssh_ca
  default_ttl: 15m
  min_ttl: 1m
  max_ttl: 1h
  allowed_principals:
    - "ztna"
    - "${username}"

policy:
  seed_file: ./policies.yaml

resource:
  seed_file: ./resources.yaml
